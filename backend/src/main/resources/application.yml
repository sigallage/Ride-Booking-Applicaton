spring:
  application:
    name: ride-booking-api
  datasource:
    url: jdbc:mysql://localhost:3306/ridebooking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: dreamhigh
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.ridebooking: DEBUG

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ZvSdcacXGMVf8602YdMCHAaKb2up0rMh}
    expiration: ${JWT_EXPIRATION:86400000}
